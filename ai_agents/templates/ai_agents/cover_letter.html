<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AI Cover Letter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-primary text-white p-4">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2 class="mb-1">

                        <i class="fas fa-file-signature"></i>

                        AI Cover Letter

                    </h2>

                    <p class="mb-0">

                        Personalized cover letter generated for your selected job.

                    </p>

                </div>

                <a href="/dashboard/"
                   class="btn btn-light">

                    <i class="fas fa-home"></i>

                    Dashboard

                </a>

            </div>

        </div>

        <div class="card-body p-4">

            {% if cached %}

            <div class="alert alert-success d-flex justify-content-between align-items-center">

                <div>

                    <strong>

                        ✅ Loaded from Smart Cache

                    </strong>

                    <br>

                    <small>

                        Generated on {{ created_at }}

                    </small>

                </div>

                <i class="fas fa-database fa-2x"></i>

            </div>

            {% else %}

            <div class="alert alert-info d-flex justify-content-between align-items-center">

                <div>

                    <strong>

                        🤖 Fresh AI Generation

                    </strong>

                    <br>

                    <small>

                        Saved automatically for future use.

                    </small>

                </div>

                <i class="fas fa-robot fa-2x"></i>

            </div>

            {% endif %}

            <div class="card border rounded-4">

                <div class="card-body">

                    <pre style="white-space:pre-wrap;
font-family:'Segoe UI',sans-serif;
font-size:16px;
line-height:1.7;
margin:0;">

{{ letter }}

                    </pre>

                </div>

            </div>

            <div class="mt-4 d-flex gap-3 flex-wrap">

                <button
                    class="btn btn-success"
                    onclick="copyLetter()">

                    <i class="fas fa-copy"></i>

                    Copy

                </button>

                <button
                    class="btn btn-secondary"
                    onclick="window.print()">

                    <i class="fas fa-print"></i>

                    Print

                </button>

                <a href="/dashboard/"
                   class="btn btn-primary">

                    <i class="fas fa-arrow-left"></i>

                    Back

                </a>

            </div>

        </div>

    </div>

</div>

<script>

function copyLetter(){

    navigator.clipboard.writeText(
        document.querySelector("pre").innerText
    );

    alert("Cover Letter copied successfully.");

}

</script>

</body>

</html>
