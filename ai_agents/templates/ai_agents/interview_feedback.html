<!DOCTYPE html>
<html>

<head>

<title>
Mock Interview Feedback
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>
🎤 AI Mock Interview
</h1>

<form method="POST">

{% csrf_token %}

<label>
Interview Question
</label>

<textarea
name="question"
class="form-control"
rows="3"
required>
</textarea>

<br>

<label>
Your Answer
</label>

<textarea
name="answer"
class="form-control"
rows="8"
required>
</textarea>

<br>

<button
type="submit"
class="btn btn-primary">

Evaluate Answer

</button>

</form>

{% if result %}

<hr>

<div class="card p-4">

<pre style="white-space: pre-wrap;">
{{ result }}
</pre>

</div>

{% endif %}

</div>

</body>

</html>
