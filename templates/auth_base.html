<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

CareerForge AI

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:flex-start;

font-family:'Segoe UI',sans-serif;

background:linear-gradient(
135deg,
#2563eb,
#1e40af,
#0f172a
);

overflow-y:auto;

padding:40px 0;

}

.card-login{

width:430px;

background:
rgba(255,255,255,.12);

backdrop-filter:
blur(18px);

border-radius:25px;

padding:40px;

box-shadow:
0 15px 40px rgba(0,0,0,.25);

color:white;

animation:fadeIn .8s;

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logo h2{

font-weight:700;

}

.logo p{

font-size:14px;

opacity:.85;

}

.form-control{

border-radius:12px;

height:50px;

margin-bottom:18px;

}

.btn-primary{

width:100%;

height:50px;

border-radius:12px;

font-weight:600;

}

.btn-google{

width:100%;

height:50px;

border-radius:12px;

font-weight:600;

background:white;

color:#333;

margin-top:12px;

}

.btn-google:hover{

background:#f3f3f3;

}

.footer{

text-align:center;

margin-top:25px;

font-size:13px;

opacity:.8;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="card-login">

<div class="logo">

<h2>

🚀 CareerForge AI

</h2>

<p>

Build • Prepare • Apply • Get Hired

</p>

</div>

{% block content %}

{% endblock %}

<div class="footer">

© 2026 CareerForge AI

</div>

</div>

</body>

</html>
