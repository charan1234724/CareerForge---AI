<!DOCTYPE html>
<html>

<head>

<title>
Job Details
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<a
href="/real-jobs/"
class="btn btn-dark">

← Back

</a>

<a
href="/resume-tailor/?job_text={{ job_text }}"
class="btn btn-success"
>

📄 Tailor Resume

</a>

<a
href="/cover-letter/?job_text={{ job_text }}"
class="btn btn-primary"
>

📝 Generate Cover Letter

</a>

<h1 class="mt-3">
{{ title }}
</h1>

<h4>
{{ company }}
</h4>

<p>

<strong>
Match Score:
</strong>

{{ score }}%

</p>

<div class="card mt-3">

<div class="card-body">

<h5>
Job Description
</h5>

<pre style="white-space: pre-wrap;">
{{ job_text }}
</pre>

</div>

</div>

</div>

</body>

</html>
